{% extends "layout.html" %}
{% block content %}
<div class="wrap doc-wide">
  <main id="main" class="content content-wide" role="main">
    {{ body }}
    {% if prev or next %}
    <nav class="page-nav" aria-label="Sequential">
      {% if prev %}<a class="page-nav-prev" href="{{ prev.link }}"><span class="page-nav-dir">&larr; Previous</span><span class="page-nav-title">{{ prev.title }}</span></a>{% else %}<span></span>{% endif %}
      {% if next %}<a class="page-nav-next" href="{{ next.link }}"><span class="page-nav-dir">Next &rarr;</span><span class="page-nav-title">{{ next.title }}</span></a>{% endif %}
    </nav>
    {% endif %}
  </main>
</div>
{% endblock %}
