{% extends "layout.html" %}
{% block content %}
<div class="wrap docs-layout">
  <aside class="sidenav" aria-label="Documentation navigation">
    <button class="sidenav-toggle" type="button" aria-expanded="false" aria-controls="sidenav-tree">
      <span class="sidenav-toggle-label">Contents</span>
      <span class="sidenav-caret" aria-hidden="true"></span>
    </button>
    <div class="sidenav-inner" id="sidenav-tree">
      {{ toctree(maxdepth=3, includehidden=True, collapse=False, titles_only=True) }}
    </div>
  </aside>
  <main id="main" class="content" role="main"{% if api_target %} data-api-url="{{ api_target }}"{% endif %}>
    {{ body }}
    {% if prev or next %}
    <nav class="page-nav" aria-label="Sequential">
      {% if prev %}<a class="page-nav-prev" href="{{ prev.link }}"><span class="page-nav-dir">&larr; Previous</span><span class="page-nav-title">{{ prev.title }}</span></a>{% else %}<span></span>{% endif %}
      {% if next %}<a class="page-nav-next" href="{{ next.link }}"><span class="page-nav-dir">Next &rarr;</span><span class="page-nav-title">{{ next.title }}</span></a>{% endif %}
    </nav>
    {% endif %}
  </main>
</div>
{% endblock %}
